[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantedge"
version = "0.1.0"
description = "Risk-aware portfolio construction and validation for the Serendib University Endowment (QuantEdge 1.0)"
readme = "README.md"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running simulation or recovery tests",
    "network: needs internet access",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["quantedge", "components"]
